{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <div class="dashboard">
        <header>
            <h1>DB 백업 현황 대시보드</h1>
            <p class="subtitle">마지막 업데이트: <span id="lastUpdate"></span></p>
        </header>

        <div id="warningAlertSection"></div>
        <div id="dangerAlertSection"></div>

        <div class="stats-grid">

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">백업 성공</span>
                    <div class="stat-icon icon-success">✓</div>
                </div>
                <div class="stat-value" id="successDB"></div>
                <div class="stat-change" id="successRate">오늘 0% 성공률</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">백업 실패</span>
                    <div class="stat-icon icon-failed">✕</div>
                </div>
                <div class="stat-value" id="failedDB"></div>
                <div class="stat-change">즉시 확인 필요</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">Active 확인</span>
                    <div class="stat-icon icon-active">⚠️</div>
                </div>
                <div class="stat-value" id="activeDB"></div>
                <div class="stat-change">Online Backup 상태 확인 필요</div>
            </div>

            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-label">백업 대기</span>
                    <div class="stat-icon icon-pending">⏱</div>
                </div>
                <div class="stat-value" id="pendingDB"></div>
                <div class="stat-change">예정된 백업</div>
            </div>
        </div>

        <!-- <div class="chart-section">
            <div class="section-title">최근 7일 백업 성공률</div>
            <div class="chart-container">
                <canvas id="backupChart"></canvas>
            </div>
        </div> -->

        <div class="table-section">
            <div class="table-header">
                <h2 class="section-title" style="margin: 0;">데이터베이스 상세 현황</h2>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="DB 이름 검색...">
                    </div>
                </div>
            </div>

            <table id="dbBackupTable">
                <thead>
                    <tr>
                        <th>데이터베이스명</th>
                        <th>DBMS</th>
                        <th>백업 주기</th>
                        <th>상태</th>
                        <th>Online Backup 상태</th>
                        <th>마지막 백업</th>
                        <th>다음 예정</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>
</div>




<script src="/static/js/chart.min.js"></script>
<script>
    $(document).ready(() => {
        renderDashboard();
    })


    const renderDashboard = () => {
        fetch(`/database/backup/list`)
            .then(response => response.json())
            .then(res => {
                updateLastUpdate(res.updated_date)
                renderTable(res.database)
                checkAlerts(res.database)
                renderSummary(res.summary)
            })
    }

    updateLastUpdate = (date) => {
        document.getElementById('lastUpdate').textContent =
            date.toLocaleString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }


    const renderTable = (database) => {
        const tbody = document.getElementById('tableBody');

        const period_type = {
            "daily": "매일",
            "weekly": "매주",
            "monthly": "매월",
            "unknown": "없음"
        }
        const weekdays = ['월', '화', '수', '목', '금', '토', '일'];

        tbody.innerHTML = database.map(db => `
        <tr>
            <td><span class="db-name">${db.target_db}</span></td>
            <td><span class="dbms-badge dbms-${db.db_type.toLowerCase()}">${db.db_type}</span></td>
            <td>
            <span class="table-text">${period_type[db.backup_period_type]}</span>
            ${
                db.backup_period_type.toLowerCase() === 'weekly'
                ? weekdays
                    .map(
                        (day, idx) => `
                        <span class="weekday ${db.backup_days.includes(idx) ? 'active' : ''}">${day}</span>
                    `
                    )
                    .join('')
                : ''
            }
            </td>
            <td><span class="status-badge status-${db.status}">
            ${db.status === 'success' ? '성공' :
                db.status === 'failed' ? '실패' : '대기'}
            </span></td>
            <td><span class="table-text online-bk-status">${db.online_bk_status || "확인 불가"}</span></td>
            <td><span class="time-text">${db.last_backup_date_str || ""}</span></td>
            <td><span class="time-text">${db.next_backup_date_str || "확인 불가"}</span></td>
        </tr>
        `).join('');

    }

    const checkAlerts = (database) => {
        const warningAlertSection = document.getElementById('warningAlertSection');
        const dangerAlertSection = document.getElementById('dangerAlertSection');

        const failed = database.filter(db => db.status == "failed")
        const active = database.filter(db => db.online_bk_status == "ACTIVE")

        if (failed.length > 0) {
            warningAlertSection.innerHTML = `
                <div class="alert-section danger">
                    <div class="alert-title danger">🚨 경고: ${failed.length}개의 백업 실패</div>
                    <div class="alert-content danger">
                        ${failed.map(db => db.target_db).join(', ')}
                    </div>
                </div>
            `;
        }

        if (active.length > 0) {
            dangerAlertSection.innerHTML = `
                <div class="alert-section warning">
                    <div class="alert-title warning">⚠️ 주의: ${active.length}개의 ACTIVE 상태</div>
                    <div class="alert-content warning">
                        ${active.map(db => db.target_db).join(', ')}
                    </div>
                </div>
            `;
        }
    }


    const renderSummary = (summary) => {
        const success = document.getElementById('successDB');
        const failed = document.getElementById('failedDB');
        const pending = document.getElementById('pendingDB');
        const active = document.getElementById('activeDB');

        success.textContent = summary.success | 0;
        failed.textContent = summary.failed | 0;
        pending.textContent = summary.pending | 0;
        active.textContent = summary.active | 0;

        const successRateText = document.getElementById('successRate');
        successRate = summary.success / (summary.success + summary.failed) * 100
        successRateText.textContent = "오늘 " + successRate.toFixed(2) + "% 성공률"
    }


    document.getElementById('searchInput').addEventListener('input', (e) => {
        const searchTerm = e.target.value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');

        rows.forEach(row => {
            const dbName = row.querySelector('.db-name').textContent.toLowerCase();
            row.style.display = dbName.includes(searchTerm) ? '' : 'none';
        });
    });


    const ctx = document.getElementById('backupChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: ['월', '화', '수', '목', '금', '토', '일'],
            datasets: [{
                label: '백업 성공률 (%)',
                data: [95, 98, 92, 97, 89, 96, 94],
                borderColor: '#4299e1',
                backgroundColor: 'rgba(66, 153, 225, 0.1)',
                tension: 0.4,
                fill: true,
                pointRadius: 4,
                pointHoverRadius: 6
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: false,
                    min: 80,
                    max: 100,
                    ticks: {
                        callback: function(value) {
                            return value + '%';
                        }
                    }
                }
            }
        }
    });

</script>
<style>
