{% extends 'base.html' %}

{% block content %}
<div class="modern-container">
    <!-- Header -->
    <div class="page-header">
        <h1 class="page-title">데이터베이스 목록</h1>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
        <button class="btn-modern" onclick="window.location.href='/database/add'">
            <i class="fas fa-plus"></i>
            데이터베이스 추가
        </button>
    </div>

    <!-- Filter Card -->
    <div class="filter-card">
        <div class="filter-header">
            <span>검색 필터</span>
        </div>

        <form id="filterForm" onsubmit="event.preventDefault(); renderTable(1, currentPageSize);">
            <div class="filter-body">
                <div class="filter-row">
                    <div class="form-group-modern">
                        <label for="oper">운영방식</label>
                        <select id="oper" name="oper" multiple="multiple">
                            <option value="0" selected>운영</option>
                            <option value="1" selected>검증</option>
                            <option value="2" selected>개발</option>
                            <option value="5" selected>프로젝트</option>
                            <option value="4" selected>DR</option>
                            <option value="3" selected>테스트</option>
                            <option value="N" selected>(빈 값)</option>
                        </select>
                    </div>

                    <div class="form-group-modern">
                        <label for="dbms">DBMS</label>
                        <select id="dbms" name="dbms" multiple="multiple">
                            <option value="Oracle" selected>Oracle</option>
                            <option value="MySQL" selected>MySQL</option>
                            <option value="SQLServer" selected>SQLServer</option>
                            <option value="Tibero" selected>Tibero</option>
                            <option value="PostgreSQL" selected>PostgreSQL</option>
                            <option value="Sybase" selected>Sybase</option>
                            <option value="N" selected>(빈 값)</option>
                        </select>
                    </div>

                    <div class="form-group-modern">
                        <label for="queryone_status">QueryOne Status</label>
                        <select id="queryone_status" name="queryone_status" multiple="multiple">
                            <option value="ENABLE" selected>ENABLE</option>
                            <option value="DISABLE" selected>DISABLE</option>
                        </select>
                    </div>

                    <div class="form-group-modern">
                        <label for="dbsafer_port">DBSafer Port</label>
                        <input type="text" class="form-control-modern" id="dbsafer_port" name="dbsafer_port" placeholder="포트 번호 입력">
                    </div>
                </div>

                <div class="filter-row">
                    <div class="form-group-modern">
                        <label for="service_name">서비스명</label>
                        <input type="text" class="form-control-modern" id="service_name" name="service_name" placeholder="서비스명 입력">
                    </div>

                    <div class="form-group-modern">
                        <label for="instance">인스턴스명</label>
                        <input type="text" class="form-control-modern" id="instance" name="instance" placeholder="인스턴스명 입력">
                    </div>

                    <div class="form-group-modern">
                        <label for="ip">IP 주소</label>
                        <input type="text" class="form-control-modern" id="ip" name="ip" placeholder="IP 주소 입력">
                    </div>

                    <div class="form-group-modern">
                        <label for="hostname">호스트명</label>
                        <input type="text" class="form-control-modern" id="hostname" name="hostname" placeholder="호스트명 입력">
                    </div>
                </div>
            </div>

            <div class="filter-footer">
                <button type="submit" class="btn-search">
                    <i class="fas fa-search"></i> 검색
                </button>
            </div>
        </form>
    </div>

    <!-- Table Card -->
    <div class="table-card">
        <div class="table-header">
            <h2 class="section-title">데이터베이스 목록</h2>
        </div>

        <table class="table-modern">
            <thead>
                <tr>
                    <th>서비스명</th>
                    <th>운영방식</th>
                    <th>DBMS</th>
                    <th>버전</th>
                    <th>IP</th>
                    <th>DBSafer Port</th>
                    <th>Hostname</th>
                    <th>인스턴스</th>
                    <th>상태</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="9" style="text-align: center; padding: 40px; color: #a0aec0;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 24px;"></i>
                        <p style="margin-top: 12px;">데이터를 불러오는 중...</p>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Pagination -->
        <div class="pagination-container">
            <div class="page-size-selector">
                <span>페이지당 표시:</span>
                <select id="pageSize" onchange="changePageSize(this.value)">
                    <option value="10">10</option>
                    <option value="20" selected>20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
            </div>

            <div class="pagination-info" id="paginationInfo">
                <span>전체 0개 중 0-0</span>
            </div>

            <ul class="pagination" id="pagination">
            </ul>
        </div>
    </div>
</div>

<link rel="stylesheet" href="/static/css/bootstrap-multiselect.min.css">
<script src="/static/js/bootstrap-multiselect.js"></script>
<script>
let currentPageSize = 20;
let currentPage = 1;
let totalPages = 1;

$(document).ready(function() {

    const multiselectConfig = {
        includeSelectAllOption: true,
        buttonWidth: '100%',
        maxHeight: 300,
        dropUp: false,
        enableFiltering: false,
        enableCaseInsensitiveFiltering: false
    };

    $('#oper').multiselect({
        ...multiselectConfig,
        nonSelectedText: '운영방식 선택',
        nSelectedText: '개 선택됨',
        allSelectedText: '전체'
    });

    $('#dbms').multiselect({
        ...multiselectConfig,
        nonSelectedText: 'DBMS 선택',
        nSelectedText: '개 선택됨',
        allSelectedText: '전체'
    });

    $('#queryone_status').multiselect({
        ...multiselectConfig,
        nonSelectedText: 'QueryOne 상태',
        nSelectedText: '개 선택됨',
        allSelectedText: '전체'
    });

    // Multiselect 드롭다운이 화면 밖으로 나가지 않도록 조정
    $('.btn-group').on('shown.bs.dropdown', function() {
        var $dropdown = $(this).find('.multiselect-container');
        var $button = $(this).find('.multiselect');
        var dropdownHeight = $dropdown.outerHeight();
        var buttonOffset = $button.offset();
        var windowHeight = $(window).height();
        var spaceBelow = windowHeight - (buttonOffset.top + $button.outerHeight());
        
        if (spaceBelow < dropdownHeight && buttonOffset.top > dropdownHeight) {
            $dropdown.css({
                'top': 'auto',
                'bottom': '100%',
                'margin-bottom': '4px',
                'margin-top': '0'
            });
        }
    });

    // 초기 데이터 로드
    renderTable(1, 20);
});

function renderTable(page, per_page) {
    currentPage = page;
    currentPageSize = per_page;

    const selectedOper = $('#oper').val();
    const selectedDbms = $('#dbms').val();
    const selectedQueryone = $('#queryone_status').val();
    const dbsafer_port = $('#dbsafer_port').val();
    const service_name = $('#service_name').val();
    const instance = $('#instance').val();
    const ip = $('#ip').val();
    const hostname = $('#hostname').val();

    const params = new URLSearchParams();
    selectedOper.forEach(v => params.append('oper', v));
    selectedDbms.forEach(v => params.append('dbms', v));
    selectedQueryone.forEach(v => params.append('queryone_status', v));
    
    params.append('dbsafer_port', dbsafer_port);
    params.append('service_name', service_name);
    params.append('instance', instance);
    params.append('ip', ip);
    params.append('hostname', hostname);
    params.append('page', page);
    params.append('per_page', per_page);

    fetch(`/database?` + params.toString())
        .then(response => response.json())
        .then(res => {
            const tbody = document.getElementById('tableBody');
            
            if (res.data.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 40px; color: #a0aec0;">
                            <i class="fas fa-database" style="font-size: 48px; margin-bottom: 12px;"></i>
                            <p style="margin-top: 12px;">검색 결과가 없습니다.</p>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = res.data.map(db => `
                    <tr>
                        <td>
                            <a href="/database/${db.id}" class="table-link">${db.service_name || ""}</a>
                        </td>
                        <td><span class="badge oper-${db.oper}">${db.oper_state || ""}</span></td>
                        <td><span class="badge dbms-${db.dbms ? db.dbms.toLowerCase() : ''}">${db.dbms || ""}</span></td>
                        <td>${db.sw_version || ""}</td>
                        <td>${db.ip || ""}</td>
                        <td>${db.dbsafer_port || ""}</td>
                        <td>${db.hostname || ""}</td>
                        <td>${db.instance || ""}</td>
                        <td>${db.use_flag || ""}</span></td>
                    </tr>
                `).join('');
            }

            totalPages = res.total_pages;
            renderPagination(res.page, res.total_pages, res.total, res.data.length);
        })
        .catch(error => {
            console.error('Error:', error);
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="9" style="text-align: center; padding: 40px; color: #fc8181;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 48px; margin-bottom: 12px;"></i>
                        <p style="margin-top: 12px;">데이터를 불러오는 중 오류가 발생했습니다.</p>
                    </td>
                </tr>
            `;
        });
}

function renderPagination(current, totalPages, totalCount, currentCount) {
    const container = document.getElementById('pagination');
    const infoContainer = document.getElementById('paginationInfo');
    
    const startIndex = (current - 1) * currentPageSize + 1;
    const endIndex = startIndex + currentCount - 1;
    infoContainer.innerHTML = `<span>전체 ${totalCount}개 중 ${startIndex}-${endIndex}</span>`;
    
    container.innerHTML = '';

    const firstLi = document.createElement('li');
    firstLi.className = 'page-item' + (current === 1 ? ' disabled' : '');
    firstLi.innerHTML = `<a class="page-link"><i class="fas fa-angle-double-left"></i></a>`;
    firstLi.onclick = (e) => {
        e.preventDefault();
        if (current > 1) renderTable(1, currentPageSize);
    };
    container.appendChild(firstLi);

    const prevLi = document.createElement('li');
    prevLi.className = 'page-item' + (current === 1 ? ' disabled' : '');
    prevLi.innerHTML = `<a class="page-link"><i class="fas fa-angle-left"></i></a>`;
    prevLi.onclick = (e) => {
        e.preventDefault();
        if (current > 1) renderTable(current - 1, currentPageSize);
    };
    container.appendChild(prevLi);

    let pageRange = [];
    if (totalPages <= 7) {
        pageRange = Array.from({length: totalPages}, (_, i) => i + 1);
    } else {
        if (current <= 4) {
            pageRange = [1, 2, 3, 4, 5, '...', totalPages];
        } else if (current >= totalPages - 3) {
            pageRange = [1, '...', totalPages - 4, totalPages - 3, totalPages - 2, totalPages - 1, totalPages];
        } else {
            pageRange = [1, '...', current - 1, current, current + 1, '...', totalPages];
        }
    }

    pageRange.forEach(pageNum => {
        const li = document.createElement('li');
        if (pageNum === '...') {
            li.className = 'page-item disabled';
            li.innerHTML = `<span class="page-link">...</span>`;
        } else {
            li.className = 'page-item' + (pageNum === current ? ' active' : '');
            li.innerHTML = `<a class="page-link">${pageNum}</a>`;
            li.onclick = (e) => {
                e.preventDefault();
                renderTable(pageNum, currentPageSize);
            };
        }
        container.appendChild(li);
    });

    const nextLi = document.createElement('li');
    nextLi.className = 'page-item' + (current === totalPages ? ' disabled' : '');
    nextLi.innerHTML = `<a class="page-link"><i class="fas fa-angle-right"></i></a>`;
    nextLi.onclick = (e) => {
        e.preventDefault();
        if (current < totalPages) renderTable(current + 1, currentPageSize);
    };
    container.appendChild(nextLi);

    const lastLi = document.createElement('li');
    lastLi.className = 'page-item' + (current === totalPages ? ' disabled' : '');
    lastLi.innerHTML = `<a class="page-link"><i class="fas fa-angle-double-right"></i></a>`;
    lastLi.onclick = (e) => {
        e.preventDefault();
        if (current < totalPages) renderTable(totalPages, currentPageSize);
    };
    container.appendChild(lastLi);
}

function changePageSize(size) {
    currentPageSize = parseInt(size);
    renderTable(1, currentPageSize);
}
</script>
